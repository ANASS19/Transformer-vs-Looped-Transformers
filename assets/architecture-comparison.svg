<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
<title id="title">Standard and Looped Transformer architecture comparison</title>
<desc id="desc">The standard model applies four independently parameterized Transformer blocks. The looped model applies one shared Transformer block four times to successive hidden states.</desc>
<defs>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#101d35"/><stop offset="1" stop-color="#0c1729"/></linearGradient>
  <linearGradient id="cyan"><stop stop-color="#36d9ed"/><stop offset="1" stop-color="#7ddff3"/></linearGradient>
  <linearGradient id="violet"><stop stop-color="#8a78ff"/><stop offset="1" stop-color="#c0a3ff"/></linearGradient>
  <marker id="arrowC" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#6ee7f3"/></marker>
  <marker id="arrowV" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#b4a1ff"/></marker>
</defs>
<rect width="1200" height="670" rx="18" fill="#080f20"/>
<text x="600" y="48" fill="#f1f7ff" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle">Same depth of execution. Different parameter sharing.</text>
<text x="300" y="91" fill="#6ee7f3" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1.5" text-anchor="middle">A · STANDARD TRANSFORMER</text>
<text x="900" y="91" fill="#b4a1ff" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1.5" text-anchor="middle">B · LOOPED TRANSFORMER</text>
<rect x="44" y="112" width="512" height="478" rx="17" fill="url(#panel)" stroke="#31506e"/>
<rect x="644" y="112" width="512" height="478" rx="17" fill="url(#panel)" stroke="#5a4a91"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
  <rect x="224" y="136" width="152" height="38" rx="9" fill="#14283d" stroke="#47637e"/>
  <text x="300" y="160" fill="#dceaf8" font-size="15">Input tokens</text>
  <path d="M300 174V196" stroke="#6ee7f3" stroke-width="2" marker-end="url(#arrowC)"/>
  <rect x="174" y="201" width="252" height="58" rx="11" fill="#15354a" stroke="#48d8eb" stroke-width="1.5"/>
  <text x="300" y="225" fill="#f3fdff" font-size="17" font-weight="700">Transformer Block 1</text>
  <text x="300" y="245" fill="#73e7f3" font-size="13">独立 weights · θ₁</text>
  <path d="M300 259V278" stroke="#6ee7f3" stroke-width="2" marker-end="url(#arrowC)"/>
  <rect x="174" y="283" width="252" height="58" rx="11" fill="#15354a" stroke="#48d8eb" stroke-width="1.5"/>
  <text x="300" y="307" fill="#f3fdff" font-size="17" font-weight="700">Transformer Block 2</text>
  <text x="300" y="327" fill="#73e7f3" font-size="13">Independent weights · θ₂</text>
  <path d="M300 341V360" stroke="#6ee7f3" stroke-width="2" marker-end="url(#arrowC)"/>
  <rect x="174" y="365" width="252" height="58" rx="11" fill="#15354a" stroke="#48d8eb" stroke-width="1.5"/>
  <text x="300" y="389" fill="#f3fdff" font-size="17" font-weight="700">Transformer Block 3</text>
  <text x="300" y="409" fill="#73e7f3" font-size="13">Independent weights · θ₃</text>
  <path d="M300 423V442" stroke="#6ee7f3" stroke-width="2" marker-end="url(#arrowC)"/>
  <rect x="174" y="447" width="252" height="58" rx="11" fill="#15354a" stroke="#48d8eb" stroke-width="1.5"/>
  <text x="300" y="471" fill="#f3fdff" font-size="17" font-weight="700">Transformer Block 4</text>
  <text x="300" y="491" fill="#73e7f3" font-size="13">Independent weights · θ₄</text>
  <path d="M300 505V526" stroke="#6ee7f3" stroke-width="2" marker-end="url(#arrowC)"/>
  <rect x="224" y="531" width="152" height="38" rx="9" fill="#14283d" stroke="#47637e"/>
  <text x="300" y="555" fill="#dceaf8" font-size="15">Output logits</text>

  <rect x="824" y="136" width="152" height="38" rx="9" fill="#14283d" stroke="#665895"/>
  <text x="900" y="160" fill="#dceaf8" font-size="15">Input tokens</text>
  <path d="M900 174V208" stroke="#b4a1ff" stroke-width="2" marker-end="url(#arrowV)"/>
  <rect x="740" y="215" width="320" height="192" rx="16" fill="#211e43" stroke="#a18bff" stroke-width="2"/>
  <rect x="770" y="245" width="260" height="88" rx="12" fill="#302a5b" stroke="#c1b0ff" stroke-width="1.5"/>
  <text x="900" y="278" fill="#f8f5ff" font-size="19" font-weight="700">One shared Transformer block</text>
  <text x="900" y="304" fill="#c5b7ff" font-size="15">Same parameters · θ</text>
  <text x="900" y="365" fill="#e2d9ff" font-size="15">Executed repeatedly on updated hidden states</text>
  <path d="M900 407V445" stroke="#b4a1ff" stroke-width="2" marker-end="url(#arrowV)"/>
  <rect x="766" y="450" width="268" height="64" rx="12" fill="#171f3b" stroke="#7f71cb"/>
  <text x="900" y="476" fill="#f5f1ff" font-size="17" font-weight="700">4 recurrent applications</text>
  <text x="900" y="498" fill="#c5b7ff" font-size="14">h₀ → h₁ → h₂ → h₃ → h₄</text>
  <path d="M1034 482C1110 482 1112 244 1060 244" fill="none" stroke="#b4a1ff" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowV)"/>
  <path d="M900 514V526" stroke="#b4a1ff" stroke-width="2" marker-end="url(#arrowV)"/>
  <rect x="824" y="531" width="152" height="38" rx="9" fill="#14283d" stroke="#665895"/>
  <text x="900" y="555" fill="#dceaf8" font-size="15">Output logits</text>
</g>
<text x="300" y="621" fill="#a9c1d6" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">4 unique blocks · 4 block applications</text>
<text x="900" y="621" fill="#c5b7ff" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">1 unique block · 4 block applications</text>
<text x="600" y="651" fill="#7890aa" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">Conceptual architecture diagram · not to scale</text>
</svg>